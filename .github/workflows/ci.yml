name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # No GPU: a fake worker and a fake llm_build stand in for TensorRT Edge-LLM.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System packages (the C++ worker is compiled against stand-in headers)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ nlohmann-json3-dev openssl curl
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -rs

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check the wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
          unzip -l dist/*.whl | grep -q "edgeserve/native/build.sh"
          unzip -l dist/*.whl | grep -q "edgeserve/native/edgellm/patches/0005-"
          unzip -l dist/*.whl | grep -q "edgeserve/export_patches/0002-"
          ! tar tzf dist/*.tar.gz | grep -E "/models/.+|\.env$|\.key$"
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-venv/bin/edgeserve --version
          for command in setup export serve build info batch check service; do /tmp/wheel-venv/bin/edgeserve $command --help > /dev/null; done
