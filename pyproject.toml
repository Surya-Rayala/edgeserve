[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeserve"
dynamic = ["version"]
description = "OpenAI-compatible LLM server for TensorRT Edge-LLM on NVIDIA Jetson and NVIDIA GPUs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ email = "suryachand2k1@gmail.com" }]
requires-python = ">=3.10"
keywords = ["llm", "inference", "server", "tensorrt", "tensorrt-edge-llm", "jetson", "openai", "edge-ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: GPU :: NVIDIA CUDA",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<0.55",  # edgeserve.cli extends uvicorn's h11 protocol class
  "pydantic>=2.7,<3",
  "prometheus-client>=0.20",
  "httpx>=0.27,<1",
  "onnx>=1.16",
  "nvidia-ml-py>=12; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "openai>=1.40", "tomli>=2; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/Surya-Rayala/edgeserve"
Documentation = "https://github.com/Surya-Rayala/edgeserve#readme"
Source = "https://github.com/Surya-Rayala/edgeserve"
Issues = "https://github.com/Surya-Rayala/edgeserve/issues"

[project.scripts]
edgeserve = "edgeserve.cli:main"

[tool.setuptools.dynamic]
version = { attr = "edgeserve.__version__" }

[tool.setuptools.packages.find]
include = ["edgeserve*"]

[tool.setuptools.package-data]
# The GPU runtime's sources (edgeserve setup builds them on the machine that serves) and the patches edgeserve
# export applies to Edge-LLM's exporter.
edgeserve = [
  "native/*.cpp",
  "native/CMakeLists.txt",
  "native/build.sh",
  "native/edgellm/COMMIT",
  "native/edgellm/patches/*.patch",
  "export_patches/*.patch",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
